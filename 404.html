<!-- Pagina servida pelo GitHub Pages em QUALQUER caminho inexistente. Existe para que as URLs
     do site anterior (/UserGuide.pdf, /logistics.js, /lang.js, /info_data.json, /icon.png...)
     caiam em algo da Repinho em vez da tela generica do GitHub, que estampa a marca errada
     num dominio de cliente. Tudo inline de proposito: nao pode depender de /styles.css nem de
     fonte externa — se um cache velho ainda existir no navegador do visitante, esta pagina
     precisa aparecer certa mesmo assim. -->
<style>
  html,body{margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#FAF9F5;color:#11331F;
       font:400 16px/1.6 'Public Sans',Arial,Helvetica,sans-serif;
       padding:32px;text-align:center}
  .box{max-width:520px}
  .code{font:400 13px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
        letter-spacing:.18em;text-transform:uppercase;color:#8A9188;margin:0 0 18px}
  h1{font:400 clamp(30px,6vw,44px)/1.15 Georgia,serif;margin:0 0 14px}
  p{margin:0 0 28px;color:#4A554B}
  a.cta{display:inline-block;text-decoration:none;background:#11331F;color:#FAF9F5;
        padding:14px 26px;border-radius:999px;font-weight:600;font-size:15px}
  a.cta:hover{background:#1E6B2A}
</style>
</head>
<body>
  <div class="box">
    <p class="code">Error 404</p>
    <h1>This page has moved</h1>
    <p>Our inventory site has been rebuilt. Everything &mdash; available stock, specifications
       and the user guide &mdash; now lives on a single page.</p>

  </div>
</body>
